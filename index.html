<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>ArDrop — Магазин</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0e13;
    --panel: #12161d;
    --panel-2: #1c222c;
    --border: #232a36;
    --text: #e6edf3;
    --muted: #8b949e;
    --dim: #6e7681;
    --accent: #f5a623;
    --accent-2: #ffb833;
    --green: #3fb950;
    --red: #da3633;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding-bottom: 76px;
    overflow-x: hidden;
  }

  /* ---------- Верхняя панель ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, #12161d, #0f131a);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(10px);
  }
  .currency {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
  }
  .currency svg { width: 16px; height: 16px; }
  .currency b { color: var(--accent); }
  .brand {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .brand span { color: var(--text); }
  .brand small {
    display: block;
    font-size: 8px;
    color: var(--dim);
    letter-spacing: 2px;
    font-weight: 500;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1c222c, #12161d);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(245,166,35,.35);
  }
  .avatar svg { width: 22px; height: 22px; }

  /* ---------- Вкладки ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 61px; z-index: 25;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    letter-spacing: .3px;
  }
  .tabs button.active {
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13;
    box-shadow: 0 4px 12px rgba(245,166,35,.3);
  }
  .tabs button:hover:not(.active) {
    color: var(--text);
    background: var(--panel-2);
  }
  .tabs .badge {
    display: inline-block;
    background: #fff;
    color: #0b0e13;
    font-size: 10px;
    font-weight: 800;
    border-radius: 10px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  /* ---------- Hero-баннер ---------- */
  .hero {
    margin: 14px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #3a2a12, #1a130a);
    border: 1px solid #4a3418;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(245,166,35,.25), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(245,166,35,.15), transparent 55%);
    pointer-events: none;
  }
  .hero-art {
    position: absolute;
    right: -30px; top: 50%;
    transform: translateY(-50%);
    width: 240px; height: 240px;
    opacity: .85;
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero .label {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 800;
  }
  .hero .title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1;
    margin: 4px 0;
    color: #fff;
    text-shadow: 0 4px 20px rgba(245,166,35,.5);
  }
  .hero .subtitle {
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 3px;
  }
  .hero-timer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .5px;
    position: relative; z-index: 1;
  }
  .hero-timer b { color: var(--accent); font-weight: 800; }

  /* ---------- Сетка товаров ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 4px 14px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform .12s, border-color .15s;
  }
  .card:active { transform: scale(.97); }
  .card .img {
    height: 110px;
    background: linear-gradient(135deg, #1c222c, #12161d);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .card .img svg { width: 58px; height: 58px; }
  .card .discount {
    position: absolute; top: 8px; right: 8px;
    background: var(--red);
    color: #fff;
    font-size: 11px; font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: .3px;
  }
  .card .info { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card .qty {
    display: flex; align-items: center; gap: 6px;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: .5px;
  }
  .card .qty svg { width: 18px; height: 18px; }
  .card .buy {
    margin-top: auto;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13;
    border: none;
    padding: 11px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .5px;
    transition: transform .1s, box-shadow .15s;
  }
  .card .buy:active { transform: scale(.96); }
  .card .buy:disabled {
    background: var(--panel-2);
    color: #484f58;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- Нижнее меню ---------- */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, #12161d, #0d1117);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
    backdrop-filter: blur(10px);
  }
  .bottom-nav button {
    background: transparent;
    border: none;
    color: var(--dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    flex: 1;
  }
  .bottom-nav button svg { width: 22px; height: 22px; }
  .bottom-nav button.active { color: var(--accent); }
  .bottom-nav button:active { transform: scale(.92); }

  /* ---------- Тост ---------- */
  #toast {
    position: fixed;
    bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 100;
    max-width: 90vw;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform .3s;
    pointer-events: none;
  }
  #toast svg { width: 18px; height: 18px; flex-shrink: 0; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.error { border-left-color: var(--red); }

  /* ---------- Модалки ---------- */
  .modal-back {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .modal-back.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 380px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: modalIn .2s ease-out;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  .modal h3 {
    font-size: 17px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal h3 svg { width: 20px; height: 20px; color: var(--accent); }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal label {
    display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px; font-weight: 700;
  }
  .modal input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,166,35,.15);
  }
  .modal .row { display: flex; gap: 10px; margin-top: 16px; }
  .modal .row button {
    flex: 1; padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--border);
    transition: all .15s;
  }
  .modal .btn-cancel { background: var(--panel-2); color: var(--muted); }
  .modal .btn-ok {
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13;
    border-color: var(--accent);
  }
  .modal .err {
    color: var(--red);
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
    font-weight: 600;
  }
  .modal .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .modal .success { color: var(--green); font-size: 13px; margin-top: 8px; font-weight: 600; }

  /* ---------- Надпись "потяни вверх" для мобильного скролла ---------- */
  .pull-hint {
    text-align: center;
    color: var(--dim);
    font-size: 11px;
    padding: 8px 0 4px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="currency">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="url(#cA)"/>
      <defs><radialGradient id="cA" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#ffe28a"/><stop offset="100%" stop-color="#f5a623"/>
      </radialGradient></defs>

  </div>
  <div class="brand" id="brandBtn">
    Ar<span>Drop</span>
    <small>GAME STORE</small>
  </div>
  <div class="avatar">

</div>

<div class="tabs">

<div class="pull-hint">↓ ЛИСТАЙ ВНИЗ ↓</div>

<div class="grid" id="grid"></div>

<div class="bottom-nav">

  <button data-nav="gifts">

  </button>
  <button data-nav="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

  </button>
</div>

<div id="toast"></div>

<div class="modal-back" id="modalPass">
  <div class="modal">
    <h3>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>

    <div class="err" id="passErr"></div>
    <div class="row">
      <button class="btn-cancel" id="passCancel">Отмена</button>
      <button class="btn-ok" id="passOk">Войти</button>
    </div>
  </div>
</div>

<div class="modal-back" id="modalAdmin">
  <div class="modal">
    <h3>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>

      Настройки

    <input type="text" id="nameInput" placeholder="ArDrop" maxlength="20" autocomplete="off">
    <div class="hint">Вторая половина слова выделяется цветом.</div>
    <div class="success" id="adminOk"></div>
    <div class="row">
      <button class="btn-cancel" id="adminClose">Закрыть</button>
      <button class="btn-ok" id="adminSave">Сохранить</button>

  </div>
 </div>
 <script>

  coin5: `<svg viewBox="0 0 64 64" fill="none">

    <ellipse cx="30" cy="34" rx="18" ry="12" fill="#ffc94d"/>

    <ellipse cx="34" cy="28" rx="12" ry="8" fill="none" stroke="#8a5a00" stroke-width="1" opacity=".4"/>
    <defs><linearGradient id="c5G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe28a"/><stop offset="100%" stop-color="#f5a623"/>
    </linearGradient></defs>
  </svg>`,
  coin10: `<svg viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="24" fill="url(#c10G)" stroke="#8a5a00" stroke-width="1.5"/>
    <text x="32" y="41" text-anchor="middle" font-size="22" font-weight="900" fill="#7a4f00">₳</text>
    <defs><linearGradient id="c10G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe28a"/><stop offset="100%" stop-color="#e08f00"/>
    </linearGradient></defs>
  </svg>`,
  chest: `<svg viewBox="0 0 64 64" fill="none">
    <rect x="8" y="26" width="48" height="26" rx="3" fill="#8a5a00"/>
    <rect x="8" y="20" width="48" height="12" rx="4" fill="#a86e00"/>
    <path d="M8 32 h48" stroke="#5a3a00" stroke-width="1.5"/>
    <rect x="28" y="28" width="8" height="10" rx="1.5" fill="#ffe28a"/>
    <circle cx="32" cy="33" r="1.5" fill="#5a3a00"/>
  </svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 L9 17 L4 12"/>
  </svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <path d="M12 5 v14 M5 12 h14"/>
  </svg>`
};

/* ============================================================
   НАСТРОЙКИ САЙТА
   ============================================================ */
const SETTINGS_KEY = 'ardrop_settings_v2';
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p.name === 'string' && p.name.trim()) return { name: p.name.trim() };
    }
  } catch (e) {}
  return { name: 'ArDrop' };
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}
let settings = loadSettings();
const brandBtn = document.getElementById('brandBtn');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function applySiteName(name) {
  const mid = Math.ceil(name.length / 2);
  const left = name.slice(0, mid);
  const right = name.slice(mid);
  brandBtn.innerHTML = esc(left) + '<span>' + esc(right) + '</span>' + '<small>GAME STORE</small>';
  document.title = name + ' — Магазин';
}

/* ============================================================
   АДМИНКА: 5 КЛИКОВ ПО БРЕНДУ
   ============================================================ */
let clickCount = 0, clickTimer = null;
brandBtn.addEventListener('click', () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
  if (clickCount >= 5) { clickCount = 0; openPassModal(); }
});

const modalPass = document.getElementById('modalPass');
const passInput = document.getElementById('passInput');
const passErr   = document.getElementById('passErr');

function openPassModal() {
  passInput.value = '';
  passErr.textContent = '';
  modalPass.classList.add('show');
  setTimeout(() => passInput.focus(), 60);
}
function closePassModal() { modalPass.classList.remove('show'); }

document.getElementById('passCancel').addEventListener('click', closePassModal);
document.getElementById('passOk').addEventListener('click', tryLogin);
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin() {
  if (passInput.value === '1212') {
    passErr.textContent = '';
    closePassModal();
    openAdminModal();
  } else {
    passErr.textContent = 'Неверный пароль';
    passInput.value = '';
    passInput.focus();
  }
}

const modalAdmin = document.getElementById('modalAdmin');
const nameInput  = document.getElementById('nameInput');
const adminOk    = document.getElementById('adminOk');

function openAdminModal() {
  nameInput.value = settings.name;
  adminOk.textContent = '';
  modalAdmin.classList.add('show');
  setTimeout(() => nameInput.focus(), 60);
}
function closeAdminModal() { modalAdmin.classList.remove('show'); }

document.getElementById('adminClose').addEventListener('click', closeAdminModal);
document.getElementById('adminSave').addEventListener('click', () => {
  const val = nameInput.value.trim();
  if (!val) {
    adminOk.style.color = 'var(--red)';
    adminOk.textContent = 'Название не может быть пустым';
    return;
  }
  settings.name = val;
  saveSettings(settings);
  applySiteName(settings.name);
  adminOk.style.color = 'var(--green)';
  adminOk.textContent = '✓ Сохранено';
  setTimeout(() => { adminOk.textContent = ''; }, 1500);
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('adminSave').click();
});
[modalPass, modalAdmin].forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    modalPass.classList.remove('show');
    modalAdmin.classList.remove('show');
  }
});

/* ============================================================
   КАТАЛОГ
   ============================================================ */
const items = [
  { id: 1, cat: 'shop', icon: 'ticket',      qty: 100,  price: 89,   discount: null },
  { id: 2, cat: 'shop', icon: 'ticketStack', qty: 500,  price: 389,  discount: '-10%' },
  { id: 3, cat: 'shop', icon: 'ticketStack', qty: 1500, price: 989,  discount: '-25%' },
  { id: 4, cat: 'shop', icon: 'pass',        qty: 3000, price: 1690, discount: '-33%' },
  { id: 5, cat: 'shop', icon: 'chest',       qty: 5000, price: 2699, discount: '-40%' },
  { id: 6, cat: 'promo', icon: 'coin1',      qty: 100,  price: 49,   discount: '-50%' },
  { id: 7, cat: 'promo', icon: 'coin5',      qty: 700,  price: 249,  discount: '-30%' },
  { id: 8, cat: 'promo', icon: 'pass',       qty: 1500, price: 749,  discount: '-20%' },
  { id: 9, cat: 'gold',  icon: 'coin10',     qty: 10000, price: 4990, discount: null },
  { id: 10, cat: 'gold', icon: 'chest',      qty: 25000, price: 9990, discount: '-15%' },
];

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const STORAGE_KEY = 'ardrop_state_v2';
let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return {
        balance: Number(p.balance) || 0,
        purchased: Array.isArray(p.purchased) ? p.purchased : []
      };
    }
  } catch (e) {}
  return { balance: 0, purchased: [] };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let currentCat = 'shop';
const gridEl    = document.getElementById('grid');
const balanceEl = document.getElementById('balance');
const toastEl   = document.getElementById('toast');

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render() {
  const list = items.filter(i => i.cat === currentCat);
  gridEl.innerHTML = '';
  list.forEach(item => {
    const bought = state.purchased.includes(item.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${item.discount ? `<span class="discount">${item.discount}</span>` : ''}
      <div class="img">${ICONS[item.icon] || ''}</div>
      <div class="info">
        <div class="qty">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="8" width="18" height="10" rx="2" fill="#f5a623"/>
            <circle cx="3" cy="13" r="1.6" fill="#0b0e13"/>
            <circle cx="21" cy="13" r="1.6" fill="#0b0e13"/>
            <path d="M9 11 h6 M9 15 h4" stroke="#0b0e13" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
          </svg>
          ${item.qty}
        </div>
        <button class="buy" ${bought ? 'disabled' : ''} data-id="${item.id}">
          ${bought ? '✓ Куплено' : item.price + ' ₽'}
        </button>
      </div>
    `;
    gridEl.appendChild(card);
  });
}

/* ============================================================
   ПОКУПКА
   ============================================================ */
gridEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  const item = items.find(i => i.id === Number(btn.dataset.id));
  if (!item) return;

  state.purchased.push(item.id);
  state.balance += item.qty;
  saveState();
  balanceEl.textContent = state.balance;
  render();
  toast(ICONS.check + ' Получено ' + item.qty + ' 🎟', false);
});

/* ============================================================
   ПОПОЛНЕНИЕ
   ============================================================ */
function topup() {
  const amount = 1000;
  state.balance += amount;
  saveState();
  balanceEl.textContent = state.balance;
  toast(ICONS.plus + ' Баланс пополнен на ' + amount, false);
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

/* ============================================================
   НИЖНЕЕ МЕНЮ
   ============================================================ */
document.querySelectorAll('.bottom-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    const nav = btn.dataset.nav;
    if (nav === 'topup') { topup(); return; }
    if (nav === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (nav === 'shop') {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelector('.tabs button[data-cat="shop"]').classList.add('active');
        currentCat = 'shop';
        render();
      }
    }
  });
});

/* ============================================================
   ТОСТ
   ============================================================ */
let toastTimer;
function toast(html, isError) {
  toastEl.innerHTML = html;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ============================================================
   ТАЙМЕР СЕЗОНА (18 дней вперёд)
   ============================================================ */
const seasonEnd = Date.now() + 18 * 24 * 3600 * 1000 + 17 * 3600 * 1000 + 33 * 60 * 1000;
function updateTimer() {
  let diff = seasonEnd - Date.now();
  if (diff < 0) diff = 0;
  const d = Math.floor(diff / (24 * 3600 * 1000));
  diff -= d * 24 * 3600 * 1000;
  const h = Math.floor(diff / (3600 * 1000));
  diff -= h * 3600 * 1000;
  const m = Math.floor(diff / (60 * 1000));
  document.getElementById('timer').textContent = d + 'д ' + h + 'ч ' + m + 'м';
}
setInterval(updateTimer, 30000);
updateTimer();

/* ============================================================
   СТАРТ
   ============================================================ */
applySiteName(settings.name);
balanceEl.textContent = state.balance;
render();
</script>
