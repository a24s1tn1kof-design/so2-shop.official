<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>ArDrop — Магазин</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0e13;
    --panel: #12161d;
    --panel-2: #1c222c;
    --border: #232a36;
    --text: #e6edf3;
    --muted: #8b949e;
    --dim: #6e7681;
    --accent: #f5a623;
    --accent-2: #ffb833;
    --green: #3fb950;
    --red: #da3633;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding-bottom: 76px; overflow-x: hidden; }
  svg { max-width: 100%; display: block; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, #12161d, #0f131a);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .currency {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 20px;
    font-weight: 700; font-size: 13px;
  }
  .currency svg { width: 16px !important; height: 16px !important; }
  .currency b { color: var(--accent); }
  .brand {
    flex: 1; text-align: center;
    font-size: 20px; font-weight: 800;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); cursor: pointer; user-select: none;
  }
  .brand span { color: var(--text); }
  .brand small { display: block; font-size: 8px; color: var(--dim); letter-spacing: 2px; font-weight: 500; }
  .avatar {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #1c222c, #12161d);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 22px !important; height: 22px !important; }

  .tabs {
    display: flex; gap: 6px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 61px; z-index: 25;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex-shrink: 0; background: transparent;
    border: 1px solid transparent;
    color: var(--muted); padding: 8px 18px;
    border-radius: 20px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .tabs button.active {
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13;
    box-shadow: 0 4px 12px rgba(245,166,35,.3);
  }
  .tabs .badge {
    display: inline-block; background: #fff; color: #0b0e13;
    font-size: 10px; font-weight: 800;
    border-radius: 10px; padding: 1px 6px; margin-left: 6px;
  }

  .hero {
    margin: 14px; border-radius: 16px; overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #3a2a12, #1a130a);
    border: 1px solid #4a3418;
    min-height: 200px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px;
  }
  .hero-art {
    position: absolute; right: -30px; top: 50%;
    transform: translateY(-50%);
    width: 240px; height: 240px; opacity: .85;
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero .label {
    font-size: 11px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
  }
  .hero .title {
    font-size: 34px; font-weight: 900; letter-spacing: 1px;
    line-height: 1; margin: 4px 0; color: #fff;
  }
  .hero .subtitle {
    font-size: 15px; color: var(--accent);
    font-weight: 700; letter-spacing: 3px;
  }
  .hero-timer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; font-size: 12px;
    color: var(--muted); font-weight: 600;
    position: relative; z-index: 1;
  }
  .hero-timer b { color: var(--accent); font-weight: 800; }
</style>
</head>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 4px 14px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
  }
  .card .img {
    height: 110px;
    background: linear-gradient(135deg, #1c222c, #12161d);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .card .img > svg { width: 58px !important; height: 58px !important; }
  .card .discount {
    position: absolute; top: 8px; right: 8px;
    background: var(--red); color: #fff;
    font-size: 11px; font-weight: 800;
    padding: 3px 8px; border-radius: 6px;
  }
  .card .info { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card .qty {
    display: flex; align-items: center; gap: 6px;
    font-size: 18px; font-weight: 800; color: var(--text);
  }
  .card .qty > svg { width: 18px !important; height: 18px !important; }
  .card .buy {
    margin-top: auto;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13;
    border: none; padding: 11px; border-radius: 10px;
    font-weight: 800; font-size: 14px;
    cursor: pointer; font-family: inherit; letter-spacing: .5px;
  }
  .card .buy:disabled {
    background: var(--panel-2);
    color: #484f58;
    cursor: not-allowed;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, #12161d, #0d1117);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  .bottom-nav button {
    background: transparent; border: none;
    color: var(--dim);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600;
    padding: 6px 12px; border-radius: 10px;
    cursor: pointer; font-family: inherit; flex: 1;
  }
  .bottom-nav button svg { width: 22px !important; height: 22px !important; }
  .bottom-nav button.active { color: var(--accent); }

  .modal-back {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200; padding: 16px;
  }
  .modal-back.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 380px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h3 {
    font-size: 17px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal h3 svg { width: 20px !important; height: 20px !important; color: var(--accent); }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal label {
    display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px; font-weight: 700;
  }
  .modal input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px; border-radius: 10px;
    font-size: 15px; font-family: inherit; letter-spacing: 1px;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,166,35,.15);
  }
  .modal .row { display: flex; gap: 10px; margin-top: 16px; }
  .modal .row button {
    flex: 1; padding: 12px; border-radius: 10px;
    font-weight: 700; font-size: 14px;
    cursor: pointer; font-family: inherit;
    border: 1px solid var(--border);
  }
  .modal .btn-cancel { background: var(--panel-2); color: var(--muted); }
  .modal .btn-ok {
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #0b0e13; border-color: var(--accent);
  }
  .modal .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; font-weight: 600; }
  .modal .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .modal .success { color: var(--green); font-size: 13px; margin-top: 8px; font-weight: 600; }
</style>
</head>

   <script>
const SETTINGS_KEY = 'ardrop_settings_v5';
let settings = loadSettings();

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p.name === 'string' && p.name.trim()) return { name: p.name.trim() };
    }
  } catch (e) {}
  return { name: 'ArDrop' };
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}

const brandBtn = document.getElementById('brandBtn');
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function applySiteName(name) {
  const mid = Math.ceil(name.length / 2);
  brandBtn.innerHTML = escapeHtml(name.slice(0, mid)) +
    '<span>' + escapeHtml(name.slice(mid)) + '</span>' +
    '<small>GAME STORE</small>';
  document.title = name + ' — Магазин';
}

      const p = JSON.parse(raw);
      return {
        balance: Number(p.balance) || 0,
        purchased: Array.isArray(p.purchased) ? p.purchased : []
      };
    }
  } catch (e) {}
  return { balance: 0, purchased: [] };
}
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
}

const gridEl    = document.getElementById('grid');
const balanceEl = document.getElementById('balance');
const timerEl   = document.getElementById('timer');

function render() {
  const list = CATALOG[currentTab] || [];
  gridEl.innerHTML = '';
  list.forEach(item => {
    const bought = state.purchased.includes(item.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img">
        ${item.discount ? `<span class="discount">-${item.discount}%</span>` : ''}
        ${ICONS[item.icon] || ''}
      </div>
      <div class="info">
        <div class="qty">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="url(#pQ)"/>
            <defs><radialGradient id="pQ" cx="35%" cy="30%">
              <stop offset="0%" stop-color="#ffe28a"/><stop offset="100%" stop-color="#f5a623"/>
            </radialGradient></defs>
          </svg>
          ${item.qty}
        </div>
        <button class="buy" ${bought ? 'disabled' : ''} data-id="${item.id}">
          ${bought ? '✓ Куплено' : item.price + ' ₽'}
        </button>
      </div>
    `;
    gridEl.appendChild(card);
  });
}

gridEl.addEventListener('click', e => {
  const btn = e.target.closest('button.buy');
  if (!btn || btn.disabled) return;
  const id = btn.dataset.id;
  let found = null;
  Object.values(CATALOG).forEach(arr => {
    const it = arr.find(x => x.id === id);
    if (it) found = it;
  });
  if (!found) return;

  state.purchased.push(found.id);
  state.balance += found.qty;
  saveState();
  balanceEl.textContent = state.balance;
  render();
});

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.cat;
    render();
  });
});

document.querySelectorAll('.bottom-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    const nav = btn.dataset.nav;
    if (nav === 'topup') {
      state.balance += 1000;
      saveState();
      balanceEl.textContent = state.balance;
      return;
    }
    document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function updateTimer() {
  const end = new Date();
  end.setDate(end.getDate() + 18);
  end.setHours(end.getHours() + 17);
  end.setMinutes(end.getMinutes() + 33);
  const diff = end - new Date();
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  timerEl.textContent = d + 'д ' + h + 'ч ' + m + 'м';
}
setInterval(updateTimer, 30000);

let clickCount = 0;
let clickTimer = null;
brandBtn.addEventListener('click', () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
  if (clickCount >= 5) {
    clickCount = 0;
    openPassModal();
  }
});

const modalPass = document.getElementById('modalPass');
const passInput = document.getElementById('passInput');
const passErr   = document.getElementById('passErr');

function openPassModal() {
  passInput.value = '';
  passErr.textContent = '';
  modalPass.classList.add('show');
  setTimeout(() => passInput.focus(), 60);
}
document.getElementById('passCancel').addEventListener('click', () => modalPass.classList.remove('show'));
document.getElementById('passOk').addEventListener('click', tryLogin);
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin() {
  if (passInput.value === '1212') {
    passErr.textContent = '';
    modalPass.classList.remove('show');
    openAdminModal();
  } else {
    passErr.textContent = 'Неверный пароль';
    passInput.value = '';
    passInput.focus();
  }
}

const modalAdmin = document.getElementById('modalAdmin');
const nameInput  = document.getElementById('nameInput');
const adminOk    = document.getElementById('adminOk');

function openAdminModal() {
  nameInput.value = settings.name;
  adminOk.textContent = '';
  modalAdmin.classList.add('show');
  setTimeout(() => nameInput.focus(), 60);
}
document.getElementById('adminClose').addEventListener('click', () => modalAdmin.classList.remove('show'));
document.getElementById('adminSave').addEventListener('click', () => {
  const val = nameInput.value.trim();
  if (!val) {
    adminOk.style.color = 'var(--red)';
    adminOk.textContent = 'Пустое название';
    return;
  }
  settings.name = val;
  saveSettings(settings);
  applySiteName(settings.name);
  adminOk.style.color = 'var(--green)';
  adminOk.textContent = '✓ Сохранено';
  setTimeout(() => { adminOk.textContent = ''; }, 1500);
});

[modalPass, modalAdmin].forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    modalPass.classList.remove('show');
    modalAdmin.classList.remove('show');
  }
});

applySiteName(settings.name);
balanceEl.textContent = state.balance;
updateTimer();
render();
</script>
</body>
</html>
